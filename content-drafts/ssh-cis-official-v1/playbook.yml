---
###############################################################################
# CURATED SUBSET cua Ansible Playbook chinh thuc do ComplianceAsCode sinh ra
# cho profile xccdf_org.ssgproject.content_profile_cis_level1_server (CIS
# Ubuntu Linux 22.04 LTS Benchmark v2.0.0, Level 1 Server) -- nguon:
# https://github.com/ComplianceAsCode/content release v0.1.81 (sha512 da
# verify khop cong bo chinh thuc).
#
# CHI giu lai: 1 task "Gather the package facts" bat buoc (nhieu task khac
# phu thuoc bien ansible_facts.packages tu day, tag "always" trong ban goc)
# + cac rule lien quan SSH (dong 18076-21281 cua file goc) -- KHONG sua doi
# noi dung cac task duoc giu (nguyen van tu ban chinh thuc, ke ca ten
# task/tags/mo ta).
#
# LOAI BO 1 rule: 'Disable SSH Root Login' (tag sshd_disable_root_login) --
# rule nay ghi cung 'PermitRootLogin no' (khong co bien de chinh, khac cac
# rule khac trong file). He thong nay SSH vao bang ROOT qua cert CA ngan han
# (remediate-apply/restore luon cung SSH_USER=root, xem app/jobs.py) -- ap
# 'PermitRootLogin no' se tu khoa vinh vien kenh ma chinh he thong dung de
# quan ly host do. Se bo sung lai rule nay (voi gia tri prohibit-password
# hoac tuong duong) sau khi xac nhan co phuong an cuu ho ngoai bang thong
# (out-of-band recovery) cho host do -- dung nguyen tac Nhom B, muc 4.5/4.6
# docs/architecture-proposal.md.
###############################################################################
- name: Ansible Playbook for xccdf_org.ssgproject.content_profile_cis_level1_server
  hosts: all
  vars:
    var_sudo_logfile: /var/log/sudo.log
    var_sudo_timestamp_timeout: '15'
    cis_banner_text: Authorized users only. All activity may be monitored and reported.
    var_password_pam_dcredit: '-1'
    var_password_pam_dictcheck: '1'
    var_password_pam_difok: '2'
    var_password_pam_lcredit: '-1'
    var_password_pam_maxrepeat: '3'
    var_password_pam_maxsequence: '3'
    var_password_pam_minclass: '4'
    var_password_pam_minlen: '14'
    var_password_pam_ocredit: '-1'
    var_password_pam_ucredit: '-1'
    var_password_hashing_algorithm_pam: yescrypt
    var_account_disable_post_pw_expiration: '45'
    var_pam_wheel_group_for_su: sugroup
    var_accounts_tmout: '900'
    var_user_initialization_files_regex: ^\.[\w\- ]+$
    var_accounts_user_umask: '027'
    var_network_filtering_service: nftables
    sysctl_net_ipv6_conf_all_accept_ra_value: '0'
    sysctl_net_ipv6_conf_all_accept_redirects_value: '0'
    sysctl_net_ipv6_conf_all_accept_source_route_value: '0'
    sysctl_net_ipv6_conf_all_forwarding_value: '0'
    sysctl_net_ipv6_conf_default_accept_ra_value: '0'
    sysctl_net_ipv6_conf_default_accept_redirects_value: '0'
    sysctl_net_ipv6_conf_default_accept_source_route_value: '0'
    sysctl_net_ipv4_conf_all_accept_redirects_value: '0'
    sysctl_net_ipv4_conf_all_accept_source_route_value: '0'
    sysctl_net_ipv4_conf_all_log_martians_value: '1'
    sysctl_net_ipv4_conf_all_rp_filter_value: '1'
    sysctl_net_ipv4_conf_all_secure_redirects_value: '0'
    sysctl_net_ipv4_conf_default_accept_redirects_value: '0'
    sysctl_net_ipv4_conf_default_accept_source_route_value: '0'
    sysctl_net_ipv4_conf_default_log_martians_value: '1'
    sysctl_net_ipv4_conf_default_rp_filter_value: '1'
    sysctl_net_ipv4_conf_default_secure_redirects_value: '0'
    sysctl_net_ipv4_icmp_echo_ignore_broadcasts_value: '1'
    sysctl_net_ipv4_icmp_ignore_bogus_error_responses_value: '1'
    sysctl_net_ipv4_tcp_syncookies_value: '1'
    var_nftables_table: filter
    var_nftables_family: inet
    var_nftables_base_chain_names: input,forward,output
    var_nftables_base_chain_types: filter,filter,filter
    var_nftables_base_chain_hooks: input,forward,output
    var_nftables_base_chain_priorities: 0,0,0
    var_nftables_base_chain_policies: accept,accept,accept
    var_timesync_service: systemd-timesyncd
    var_multiple_time_servers: time.nist.gov,time-a-g.nist.gov,time-b-g.nist.gov,time-c-g.nist.gov
    var_multiple_time_pools: time.nist.gov
    var_sshd_set_keepalive: '3'
    sshd_idle_timeout_value: '300'
    var_sshd_set_login_grace_time: '60'
    sshd_max_auth_tries_value: '4'
    var_sshd_max_sessions: '10'
    var_sshd_set_maxstartups: 10:30:60
    sshd_strong_kex: curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group-exchange-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,diffie-hellman-group14-sha256
    sshd_strong_macs: hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256
  tasks:
  - name: Gather the package facts
    ansible.builtin.package_facts:
      manager: auto
    tags:
    - always

  - name: Set the file_groupowner_sshd_config_newgroup variable if represented by
      gid
    ansible.builtin.set_fact:
      file_groupowner_sshd_config_newgroup: '0'
    when: '"linux-base" in ansible_facts.packages'
    tags:
    - NIST-800-53-AC-17(a)
    - NIST-800-53-AC-6(1)
    - NIST-800-53-CM-6(a)
    - configure_strategy
    - file_groupowner_sshd_config
    - low_complexity
    - low_disruption
    - medium_severity
    - no_reboot_needed

  - name: Test for existence /etc/ssh/sshd_config
    ansible.builtin.stat:
      path: /etc/ssh/sshd_config
    register: file_exists
    when: '"linux-base" in ansible_facts.packages'
    tags:
    - NIST-800-53-AC-17(a)
    - NIST-800-53-AC-6(1)
    - NIST-800-53-CM-6(a)
    - configure_strategy
    - file_groupowner_sshd_config
    - low_complexity
    - low_disruption
    - medium_severity
    - no_reboot_needed

  - name: Ensure group owner on /etc/ssh/sshd_config
    ansible.builtin.file:
      path: /etc/ssh/sshd_config
      follow: false
      group: '{{ file_groupowner_sshd_config_newgroup }}'
    when:
    - '"linux-base" in ansible_facts.packages'
    - file_exists.stat is defined and file_exists.stat.exists
    tags:
    - NIST-800-53-AC-17(a)
    - NIST-800-53-AC-6(1)
    - NIST-800-53-CM-6(a)
    - configure_strategy
    - file_groupowner_sshd_config
    - low_complexity
    - low_disruption
    - medium_severity
    - no_reboot_needed

  - name: Set the file_groupowner_sshd_drop_in_config_newgroup variable if represented
      by gid
    ansible.builtin.set_fact:
      file_groupowner_sshd_drop_in_config_newgroup: '0'
    when: '"linux-base" in ansible_facts.packages'
    tags:
    - NIST-800-53-AC-17(a)
    - NIST-800-53-AC-6(1)
    - NIST-800-53-CM-6(a)
    - configure_strategy
    - file_groupowner_sshd_drop_in_config
    - low_complexity
    - low_disruption
    - medium_severity
    - no_reboot_needed

  - name: Find /etc/ssh/sshd_config.d/ file(s) matching ^.*$
    ansible.builtin.command: find -P /etc/ssh/sshd_config.d/ -maxdepth 1 -type f  !
      -group 0 -regextype posix-extended -regex "^.*$"
    register: files_found
    changed_when: false
    failed_when: false
    check_mode: false
    when: '"linux-base" in ansible_facts.packages'
    tags:
    - NIST-800-53-AC-17(a)
    - NIST-800-53-AC-6(1)
    - NIST-800-53-CM-6(a)
    - configure_strategy
    - file_groupowner_sshd_drop_in_config
    - low_complexity
    - low_disruption
    - medium_severity
    - no_reboot_needed

  - name: Ensure group owner on /etc/ssh/sshd_config.d/ file(s) matching ^.*$
    ansible.builtin.file:
      path: '{{ item }}'
      follow: false
      group: '{{ file_groupowner_sshd_drop_in_config_newgroup }}'
      state: file
    with_items:
    - '{{ files_found.stdout_lines }}'
    when: '"linux-base" in ansible_facts.packages'
    tags:
    - NIST-800-53-AC-17(a)
    - NIST-800-53-AC-6(1)
    - NIST-800-53-CM-6(a)
    - configure_strategy
    - file_groupowner_sshd_drop_in_config
    - low_complexity
    - low_disruption
    - medium_severity
    - no_reboot_needed

  - name: Set the file_owner_sshd_config_newown variable if represented by uid
    ansible.builtin.set_fact:
      file_owner_sshd_config_newown: '0'
    when: '"linux-base" in ansible_facts.packages'
    tags:
    - NIST-800-53-AC-17(a)
    - NIST-800-53-AC-6(1)
    - NIST-800-53-CM-6(a)
    - configure_strategy
    - file_owner_sshd_config
    - low_complexity
    - low_disruption
    - medium_severity
    - no_reboot_needed

  - name: Test for existence /etc/ssh/sshd_config
    ansible.builtin.stat:
