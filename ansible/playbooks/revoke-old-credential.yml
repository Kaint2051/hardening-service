---
# Bước 2 của Zero-to-CA Migration (mục 4.4) — CHỈ chạy cho một máy SAU KHI đã
# xác nhận thủ công/qua Orchestrator rằng kết nối bằng SSH cert mới thành
# công trên chính máy đó. Không chạy hàng loạt theo inventory group — luôn
# chỉ định đích danh bằng --limit <hostname> để tránh khoá nhầm cả loạt máy
# nếu có sai sót.
#
# Dùng:
#   ansible-playbook -i inventory/hosts.ini playbooks/revoke-old-credential.yml \
#     --limit <tên-máy-đã-verify-cert-thành-công>

- name: Thu hồi credential cũ sau khi đã verify SSH cert mới hoạt động
  hosts: all
  become: true
  serial: 1
  max_fail_percentage: 0

  vars:
    # Mục "thống nhất 1 port" — Orchestrator không còn publish port riêng
    # (8000), chỉ còn reachable qua nginx reverse-proxy của Web (port 3000,
    # tiền tố "/api", xem apps/web/nginx.conf).
    orchestrator_audit_url: "https://localhost:3000/api/internal/audit-events"
    # Đường dẫn authorized_keys chứa key tĩnh cũ cần gỡ — điều chỉnh theo thực
    # tế từng tổ chức (thường là user quản trị mặc định dùng để onboarding).
    legacy_authorized_keys_path: "/root/.ssh/authorized_keys"

  tasks:
    - name: Xác nhận thao tác viên đã tự kiểm tra cert mới hoạt động (chặn chạy nhầm)
      ansible.builtin.pause:
        prompt: >
          Bạn đã tự tay verify SSH cert MỚI kết nối thành công tới
          {{ inventory_hostname }} chưa? Gõ "yes" để tiếp tục thu hồi
          credential cũ, bất kỳ giá trị nào khác sẽ dừng lại
      register: confirm_prompt

    - name: Dừng nếu chưa xác nhận
      ansible.builtin.fail:
        msg: "Huỷ thu hồi credential cũ — chưa xác nhận cert mới hoạt động."
      when: confirm_prompt.user_input | lower != "yes"

    - name: Sao lưu authorized_keys cũ trước khi xoá (rollback nếu cần)
      ansible.builtin.copy:
        src: "{{ legacy_authorized_keys_path }}"
        dest: "{{ legacy_authorized_keys_path }}.pre-ca-migration.bak"
        remote_src: true
        mode: "0600"

    - name: Gỡ static key cũ khỏi authorized_keys
      ansible.builtin.copy:
        content: ""
        dest: "{{ legacy_authorized_keys_path }}"
        owner: root
        group: root
        mode: "0600"

    - name: Ghi nhận migration hoàn tất vào audit log
      ansible.builtin.uri:
        url: "{{ orchestrator_audit_url }}"
        method: POST
        body_format: json
        body:
          actor: "zero-to-ca-migration-playbook"
          action: "legacy_credential_revoked"
          resource: "{{ inventory_hostname }}"
          payload:
            step: "migration_complete"
            backup_path: "{{ legacy_authorized_keys_path }}.pre-ca-migration.bak"
        status_code: [200, 201]
        # cert TLS của Orchestrator do step-ca nội bộ ký — cùng lý do
        # validate_certs: false ở playbooks/zero-to-ca-migration.yml.
        validate_certs: false
      delegate_to: localhost
      failed_when: false

    - name: In kết quả
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: migration hoàn tất — chỉ còn nhận SSH cert từ CA, credential cũ đã gỡ (backup tại {{ legacy_authorized_keys_path }}.pre-ca-migration.bak)."
