; Sao chép thành hosts.ini và điền máy thật. Nhóm theo batch nhỏ để migration
; theo canary (mục 4.4) — KHÔNG gộp toàn bộ 50 máy vào 1 nhóm chạy chung.

[batch1]
pilot-host-01.internal ansible_user=admin
pilot-host-02.internal ansible_user=admin

[batch2]
; thêm dần sau khi batch1 đã migrate ổn định
; host-03.internal ansible_user=admin

[all:vars]
; Dùng credential CŨ ở bước zero-to-ca-migration.yml (một lần duy nhất).
; KHÔNG lưu password thật vào file này — dùng --ask-pass hoặc Ansible Vault.
; ansible_ssh_private_key_file=~/.ssh/legacy_admin_key
