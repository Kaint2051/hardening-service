networks:
  mgmt-net:
    driver: bridge
  # Mạng CA tách riêng khỏi mgmt-net — chỉ orchestrator được nối cả 2 mạng.
  # Web/Keycloak KHÔNG nằm trên ca-net, đúng nguyên tắc 4.1 trong docs/architecture-proposal.md.
  ca-net:
    driver: bridge
  # Mạng nội bộ cho job execution — CHỈ orchestrator + job-dispatcher nối vào.
  # job-dispatcher là service DUY NHẤT giữ quyền Docker (mount docker.sock) —
  # xem apps/job-dispatcher/README.md để hiểu vì sao tách riêng khỏi orchestrator.
  job-net:
    driver: bridge
  # Mạng cho Agent Manager (mục 4.3) — KHÔNG nối ca-net (chỉ Orchestrator
  # được gọi CA). Agent thật (chạy trên các máy khác trong fleet, ngoài
  # docker network này) kết nối qua port publish của agent-manager, không
  # qua network Docker này — xem apps/agent-manager/README.md.
  agent-net:
    driver: bridge

volumes:
  postgres-data:
  # Repo backup pgBackRest (Giai đoạn 3 Phase 1/7 — xem
  # infra/postgres/README.md) — TẠM cùng VM/Docker daemon với postgres-data
  # (chấp nhận được ở quy mô 1 VM hiện tại, KHÔNG bảo vệ được mất cả VM; di
  # dời sang VM/host khác ở Phase 3-4 chỉ cần đổi repo1-path/repo1-host
  # trong infra/postgres/pgbackrest.conf, không đổi gì ở service postgres).
  pgbackrest-repo:
  # Volume RIÊNG cho container restore-drill (profile "restore-drill") —
  # KHÔNG BAO GIỜ đụng tới postgres-data thật, xoá sạch sau mỗi lần rehearsal
  # (xem infra/postgres/restore-drill.sh).
  postgres-restore-drill-data:
  keycloak-data:
  step-ca-data:

services:
  postgres:
    # Image build riêng (infra/postgres/Dockerfile) — postgres:16-alpine +
    # pgBackRest cài thêm layer, chạy cùng filesystem PGDATA để
    # archive_command gọi trực tiếp (xem infra/postgres/README.md).
    build: ./infra/postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_AUDIT_USER: ${POSTGRES_AUDIT_USER}
      POSTGRES_AUDIT_PASSWORD: ${POSTGRES_AUDIT_PASSWORD}
      # pgBackRest tự đọc override qua biến môi trường PGBACKREST_* (không
      # cần sửa pgbackrest.conf/archive_command) — role superuser thật của
      # cluster này là POSTGRES_USER (image chính thức KHÔNG tạo thêm role
      # "postgres" riêng khi POSTGRES_USER khác "postgres"), pgbackrest mặc
      # định lại thử kết nối bằng role "postgres" — phải khai rõ, nếu không
      # stanza-create/backup báo lỗi "role postgres does not exist".
      PGBACKREST_PG1_USER: ${POSTGRES_USER}
    # archive_mode/archive_command bật WAL archiving liên tục qua pgBackRest
    # (PITR giữa 2 lần full backup, không chỉ khôi phục về đúng lúc backup
    # gần nhất) — wal_level=replica cũng là điều kiện bắt buộc cho Phase 5
    # (streaming replication) sau này, bật luôn từ đây để khỏi phải đổi lại.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=hardening-console archive-push %p
      - -c
      - max_wal_senders=3
      - -c
      - archive_timeout=60
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - pgbackrest-repo:/var/lib/pgbackrest
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [mgmt-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Container tạm dùng CHỈ để rehearsal/verify restore PITR (KHÔNG chạy
  # thường trực — profile "restore-drill", đứng ngoài `docker compose up`
  # mặc định). Đọc-chỉ repo pgBackRest thật, phục hồi vào volume RIÊNG
  # (postgres-restore-drill-data, không phải postgres-data thật) — xem
  # infra/postgres/restore-drill.sh và infra/postgres/README.md.
  postgres-restore-drill:
    build: ./infra/postgres
    profiles: ["restore-drill"]
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        chown -R postgres:postgres /var/lib/postgresql/data
        su postgres -c 'pgbackrest --stanza=hardening-console --delta restore'
        exec docker-entrypoint-wrapper.sh postgres
    volumes:
      - postgres-restore-drill-data:/var/lib/postgresql/data
      - pgbackrest-repo:/var/lib/pgbackrest:ro
    networks: [mgmt-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Build riêng (infra/keycloak/Dockerfile) — thêm entrypoint wrapper tự lấy
  # cert TLS qua Orchestrator lúc khởi động (mục "Dựng TLS thật", xem
  # infra/keycloak/README.md) — trước đây dùng thẳng image gốc.
  keycloak:
    build: ./infra/keycloak
    restart: unless-stopped
    # --http-enabled=false: Ý ĐỊNH là tắt hẳn cổng HTTP nội bộ (8080), mục
    # tiêu của việc dựng TLS này là không còn đường plaintext nào — nhưng
    # verify thật trên lab cho thấy `start-dev` LUÔN tự bật lại HTTP dù có
    # cờ này (log khởi động in "Listening on: http://0.0.0.0:8080 and
    # https://0.0.0.0:8443" bất kể flag) — hành vi cứng của Keycloak dev mode
    # (đổi sang `start` production mode mới tắt được thật, kéo theo yêu cầu
    # cấu hình khác đáng kể, ngoài phạm vi lần làm TLS này). CHẤP NHẬN ĐƯỢC
    # vì cổng 8080 KHÔNG publish ra host (chỉ container khác trong mgmt-net
    # gọi được, không lộ ra LAN) — giữ flag này để rõ Ý ĐỊNH + sẵn sàng có
    # tác dụng thật nếu sau này đổi sang `start`.
    command: start-dev --import-realm --http-enabled=false
    # entrypoint-wrapper.sh tự thêm 2 flag --https-certificate-*-file vào
    # cuối danh sách args phía trên khi exec sang kc.sh thật.
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # entrypoint-wrapper.sh/fetch-cert.sh dùng — cổng 8001 (KHÔNG phải
      # 8000) vì đó là cổng HTTP thường nội bộ của chính Orchestrator, dùng
      # riêng cho các lần "xin cert" như thế này (xem app/serve.py và
      # comment tương đương ở service job-dispatcher/agent-manager).
      ORCHESTRATOR_INTERNAL_HOST: orchestrator
      ORCHESTRATOR_INTERNAL_PORT: "8001"
      KEYCLOAK_TLS_SHARED_SECRET: ${KEYCLOAK_TLS_SHARED_SECRET}
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      # Chiều MỚI (Keycloak cần Orchestrator chạy để xin cert TLS lúc khởi
      # động) — KHÔNG giữ chiều cũ orchestrator: depends_on: keycloak (đã bỏ
      # ở service orchestrator bên dưới), giữ cả 2 chiều sẽ tạo circular
      # dependency giống đúng sự cố đã gặp lúc làm mTLS Orchestrator/
      # job-dispatcher (xem README.md gốc mục đó) — service_started là đủ
      # (không cần service_healthy: fetch-cert.sh tự retry/backoff nếu
      # Orchestrator chưa kịp alembic-migrate + tự mint cert xong).
      orchestrator:
        condition: service_started
    # Mục "thống nhất 1 port" — KHÔNG còn publish port ra host (trước là
    # "8444:8443", đổi từ 8443 gốc vì trùng agent-manager). Browser giờ chỉ
    # vào port 3000 (web), nginx ở đó reverse-proxy "/realms/*"/"/resources/*"
    # sang chính container này qua mgmt-net (tên service "keycloak", DNS nội
    # bộ Docker) — cổng TRONG container vẫn là 8443, chỉ không map ra host nữa.
    networks: [mgmt-net]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8443"]
      # Thêm thời gian so với trước (bootstrap cert TLS qua fetch-cert.sh có
      # thể tốn tới 60s nếu Orchestrator vừa mới khởi động cùng lúc, cộng
      # thêm thời gian Keycloak/Quarkus khởi động như bình thường).
      interval: 10s
      timeout: 5s
      retries: 24

  # CA/Secrets cluster — cố ý đặt trên network riêng (ca-net), không public port,
  # không có route trực tiếp từ web/Keycloak. Chỉ orchestrator (control-plane) được gọi.
  step-ca:
    image: smallstep/step-ca:latest
    restart: unless-stopped
    environment:
      DOCKER_STEPCA_INIT_NAME: ${STEPCA_NAME}
      DOCKER_STEPCA_INIT_DNS_NAMES: ${STEPCA_DNS_NAMES}
      DOCKER_STEPCA_INIT_PROVISIONER_NAME: orchestrator
      DOCKER_STEPCA_INIT_PASSWORD: ${STEPCA_PROVISIONER_PASSWORD}
      DOCKER_STEPCA_INIT_SSH: "true"
    volumes:
      - step-ca-data:/home/step
    networks: [ca-net]
    healthcheck:
      test: ["CMD", "step", "ca", "health", "--ca-url", "https://localhost:9000", "--root", "/home/step/certs/root_ca.crt"]
      interval: 10s
      timeout: 5s
      retries: 15

  orchestrator:
    build: ./apps/orchestrator
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AUDIT_DATABASE_URL: postgresql+psycopg://${POSTGRES_AUDIT_USER}:${POSTGRES_AUDIT_PASSWORD}@postgres:5432/${POSTGRES_DB}
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL}
      WEB_ORIGIN: ${WEB_ORIGIN}
      # Hostname nội bộ trong docker network — orchestrator dùng để tự fetch
      # JWKS, tách biệt với KEYCLOAK_ISSUER_URL (URL công khai cho browser, vd
      # "localhost:8080") mà container không tự resolve tới được. Xem app/config.py.
      # https + cổng 8443 (mục "Dựng TLS thật", trước là http/8080) — cert
      # Keycloak do step-ca nội bộ ký, Orchestrator tự trust qua ssl_context
      # trong app/auth.py (KHÔNG dùng CA hệ thống mặc định).
      KEYCLOAK_INTERNAL_URL: https://keycloak:8443/realms/hardening-console
      # Secret của client "orchestrator-admin" — Orchestrator tự gọi Keycloak
      # Admin REST API bằng service account này (app/keycloak_admin.py, tính
      # năng Quản lý người dùng). KHÁC KEYCLOAK_TLS_SHARED_SECRET (đó là để
      # xin cert TLS, không liên quan Admin API) — client này phải tạo riêng
      # qua ./infra/keycloak/bootstrap-admin-client.sh, không tự có sau khi
      # import realm-export.json (xem infra/keycloak/README.md).
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      SECRET_KEY: ${ORCHESTRATOR_SECRET_KEY}
      STEPCA_PROVISIONER_PASSWORD: ${STEPCA_PROVISIONER_PASSWORD}
      JOB_DISPATCHER_URL: https://job-dispatcher:9100
      JOB_DISPATCHER_SHARED_SECRET: ${JOB_DISPATCHER_SHARED_SECRET}
      # Allowlist principal SSH cho Host.ssh_user (mục "sửa host", xem
      # app/hosts.py/app/jobs.py) — fallback "root" nếu thiếu trong .env
      # (deploy cũ chưa có dòng này vẫn giữ đúng hành vi trước đây, không
      # âm thầm thành chuỗi rỗng như các secret bắt buộc khác).
      ALLOWED_SSH_USERS: ${ALLOWED_SSH_USERS:-root}
      # Mã hoá Host.ssh_password_encrypted (app/hosts.py) — BẮT BUỘC không
      # rỗng (xem app/config.py:_reject_empty_required_secrets), không có
      # fallback mặc định vì đây là khoá bảo mật thật, không phải hành vi an
      # toàn nếu thiếu.
      HOST_CREDENTIAL_ENCRYPTION_KEY: ${HOST_CREDENTIAL_ENCRYPTION_KEY}
      # Agent Manager (mục 4.3, chưa triển khai service Go thật trong pass
      # này) sẽ gọi vào /internal/agent/* bằng secret này — cùng pattern
      # JOB_DISPATCHER_SHARED_SECRET.
      AGENT_MANAGER_SHARED_SECRET: ${AGENT_MANAGER_SHARED_SECRET}
      # Dựng TLS thật cho Keycloak/Web (mục app/serve.py + app/jobs.py:
      # keycloak_server_cert/web_server_cert) — mỗi service 1 secret riêng,
      # KHÔNG dùng chung AGENT_MANAGER_SHARED_SECRET/JOB_DISPATCHER_SHARED_SECRET.
      KEYCLOAK_TLS_SHARED_SECRET: ${KEYCLOAK_TLS_SHARED_SECRET}
      WEB_TLS_SHARED_SECRET: ${WEB_TLS_SHARED_SECRET}
      # IP/hostname LAN browser dùng để truy cập — bắt buộc có trong SAN của
      # cert Keycloak/Web/chính Orchestrator, xem app/config.py:public_host.
      PUBLIC_HOST: ${PUBLIC_HOST}
      # execution-env's remediate.sh dùng fingerprint này để verify chữ ký
      # bundle remediation trước khi chạy ansible-playbook — xem app/jobs.py
      # và scripts/content-signing/README.md.
      CONTENT_SIGNING_TRUSTED_FINGERPRINT: ${CONTENT_SIGNING_TRUSTED_FINGERPRINT}
      # Tên bundle agent đã ký hiện hành (POST /hosts/{hostname}/agent-install,
      # xem app/agents.py) — fallback rỗng nếu thiếu trong .env (deploy cũ
      # chưa có dòng này vẫn boot được, chỉ endpoint agent-install báo lỗi rõ
      # ràng khi gọi, không phải app từ chối khởi động).
      AGENT_BUNDLE_REF: ${AGENT_BUNDLE_REF:-}
      # Fingerprint GPG tin cậy RIÊNG cho bundle agent — CỐ Ý tách khỏi
      # CONTENT_SIGNING_TRUSTED_FINGERPRINT (dùng cho remediation), xem
      # app/config.py:agent_bundle_trusted_fingerprint.
      AGENT_BUNDLE_TRUSTED_FINGERPRINT: ${AGENT_BUNDLE_TRUSTED_FINGERPRINT:-}
      # Địa chỉ Agent Manager THẬT (khớp "ports: 8443:8443" của agent-manager
      # bên dưới) — agent-install nhúng vào agent.env của Agent trên máy đích,
      # xem app/config.py:agent_manager_public_url.
      AGENT_MANAGER_PUBLIC_URL: ${AGENT_MANAGER_PUBLIC_URL:-}
      # step ssh certificate --ca-url bắt buộc phải verify root cert (không có
      # cờ nào bỏ qua bước này, đã verify thật — step-cli từ chối chạy nếu
      # thiếu --root/--token). Root cert KHÔNG phải bí mật (chỉ root KEY mới
      # là bí mật) nên mount read-only step-ca-data để lấy đúng file
      # certs/root_ca.crt — đơn giản hơn là dựng thêm kênh phân phối riêng.
      STEPCA_ROOT_CERT_PATH: /stepca-root/certs/root_ca.crt
      # Active Response (mục "Agent thực thi remediation thật", xem
      # app/jobs.py:_dispatch_remediate_job) — kill-switch TOÀN CỤC, mặc định
      # false. CONTENT_SIGNING_SIGNED_DIR không cần khai báo riêng — mặc định
      # Settings đã là "/content-signed", khớp đúng đường dẫn mount read-only
      # bên dưới.
      ACTIVE_RESPONSE_ENABLED: ${ACTIVE_RESPONSE_ENABLED}
    volumes:
      - step-ca-data:/stepca-root:ro
      # Đọc TRỰC TIẾP content.tar.gz + .sig đã ký để trả cho Agent qua
      # POST /internal/agent/remediation-bundle (app/agents.py) — dùng CHUNG
      # biến host-path với job-dispatcher (CONTENT_SIGNING_SIGNED_HOST_PATH)
      # vì cùng 1 thư mục vật lý trên host, nhưng đây là mount TRỰC TIẾP vào
      # container Orchestrator (khác cơ chế Docker-outside-of-Docker mà
      # job-dispatcher dùng cho execution-env sibling container).
      - ${CONTENT_SIGNING_SIGNED_HOST_PATH}:/content-signed:ro
      # 3 file tĩnh dùng để sinh script cài Agent gộp sẵn (POST
      # /hosts/{hostname}/agent-install-script, xem app/agents.py) — đọc
      # TRỰC TIẾP từ apps/agent/ thay vì copy nội dung vào code Python, để
      # không lệch khỏi bản gốc nếu ai đó sửa provision.sh/unit file sau này.
      - ./apps/agent/provision.sh:/agent-assets/provision.sh:ro
      - ./apps/agent/hardening-agent.service:/agent-assets/hardening-agent.service:ro
      - ./apps/agent/executor/hardening-executor.service:/agent-assets/hardening-executor.service:ro
      # File playbook Ansible chính thức (ComplianceAsCode) cho tab "Template"
      # trong Control Registry — xem app/control_templates.py.
      - ./control-templates:/control-templates:ro
    depends_on:
      postgres:
        condition: service_healthy
      step-ca:
        condition: service_healthy
      # KHÔNG phụ thuộc job-dispatcher/keycloak — bỏ đi (job-dispatcher: từ
      # trước đã không có lý do thực sự, chỉ gọi LAZY khi có job thật.
      # keycloak: mục "Dựng TLS thật" mới đảo NGƯỢC quan hệ — Keycloak giờ
      # cần Orchestrator chạy trước để xin cert TLS lúc khởi động, xem
      # service keycloak bên dưới — giữ cả 2 chiều sẽ tạo circular
      # dependency, đúng lớp sự cố đã gặp khi làm mTLS Orchestrator/
      # job-dispatcher trước đây). PyJWKClient (app/auth.py) tự fetch JWKS
      # LAZY lúc có request đầu tiên cần verify token, không phải lúc import
      # module, nên Orchestrator không cần Keycloak sẵn sàng ngay lúc khởi
      # động — xác nhận qua đọc trực tiếp PyJWT (không suy đoán).
    # Mục "thống nhất 1 port" — KHÔNG còn publish 8000 ra host. Browser giờ
    # chỉ vào port 3000 (web), nginx ở đó reverse-proxy "/api/*" sang chính
    # container này qua mgmt-net (tên service "orchestrator", DNS nội bộ
    # Docker) — không cần publish port ra ngoài LAN nữa.
    # Orchestrator nối mgmt-net + ca-net (mục 4.1, để tự cấp SSH cert ngắn hạn
    # cho job) + job-net (gọi job-dispatcher) — nhưng KHÔNG có quyền Docker
    # trực tiếp, xem apps/job-dispatcher/README.md.
    networks: [mgmt-net, ca-net, job-net]

  # Service DUY NHẤT giữ quyền Docker (mount docker.sock) — xem README.md
  # cùng thư mục để hiểu vì sao tách riêng khỏi Orchestrator. KHÔNG public
  # port, chỉ nhận lệnh từ Orchestrator qua job-net.
  job-dispatcher:
    build: ./apps/job-dispatcher
    restart: unless-stopped
    environment:
      JOB_DISPATCHER_SHARED_SECRET: ${JOB_DISPATCHER_SHARED_SECRET}
      ALLOWED_EXECUTION_IMAGE: hardening-console-execution-env:latest
      # Đường dẫn TRÊN HOST DOCKER thật (Docker-outside-of-Docker: bind-mount
      # cho container sibling phải theo đường dẫn host, KHÔNG phải đường dẫn
      # bên trong chính container job-dispatcher) — xem app/main.py.
      CONTENT_SIGNING_SIGNED_HOST_PATH: ${CONTENT_SIGNING_SIGNED_HOST_PATH}
      # job-dispatcher không nối ca-net — xin cert server mTLS của chính nó
      # qua Orchestrator (POST /internal/job-dispatcher/server-cert), tự
      # renew định kỳ, cùng pattern agent-manager. Xem app/serve.py.
      # Cổng 8001 (KHÔNG phải 8000) — Orchestrator giờ phục vụ 2 cổng riêng
      # (xem apps/orchestrator/app/serve.py): 8000 là HTTPS browser-facing
      # (mục "Dựng TLS thật"), 8001 là HTTP thường NỘI BỘ chỉ dùng cho các
      # lần "xin cert" như thế này — tránh đòi job-dispatcher phải làm TLS
      # client (thêm CA trust) chỉ để gọi đúng 1 endpoint bootstrap.
      ORCHESTRATOR_URL: http://orchestrator:8001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      orchestrator:
        condition: service_started
    networks: [job-net]

  # Agent Manager (mục 4.3) — relay mTLS cho Agent tự phát triển. KHÔNG nối
  # ca-net (chỉ Orchestrator được gọi CA) — kể cả cert server của chính nó
  # cũng xin qua Orchestrator (POST /internal/agent-manager/server-cert), xem
  # apps/agent-manager/README.md.
  agent-manager:
    build: ./apps/agent-manager
    restart: unless-stopped
    environment:
      # Cổng 8001 nội bộ, KHÔNG phải 8000 (HTTPS browser-facing) — xem
      # comment tương đương ở service job-dispatcher phía trên.
      ORCHESTRATOR_URL: http://orchestrator:8001
      AGENT_MANAGER_SHARED_SECRET: ${AGENT_MANAGER_SHARED_SECRET}
    depends_on:
      orchestrator:
        condition: service_started
    # Publish ra host vì agent thật chạy trên các máy KHÁC trong fleet, cần
    # với tới qua mạng LAN — khác step-ca (cố tình không publish).
    ports:
      - "8443:8443"
    networks: [agent-net, mgmt-net]

  # SPA React tĩnh, serve bằng nginx — không có logic nghiệp vụ, chỉ gọi
  # Orchestrator API. Cùng mgmt-net với Keycloak (mục 4.1: web/Keycloak không
  # nằm trên ca-net) — xem apps/web/README.md.
  web:
    build:
      context: ./apps/web
      args:
        # Mục "thống nhất 1 port" — không còn VITE_API_BASE_URL/
        # VITE_KEYCLOAK_URL (xem apps/web/Dockerfile + nginx.conf).
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID}
    restart: unless-stopped
    environment:
      # entrypoint-wrapper.sh/fetch-cert.sh dùng (mục "Dựng TLS thật") —
      # cổng 8001 nội bộ của Orchestrator, cùng lý do đã ghi ở service
      # job-dispatcher/agent-manager/keycloak phía trên.
      ORCHESTRATOR_INTERNAL_HOST: orchestrator
      ORCHESTRATOR_INTERNAL_PORT: "8001"
      WEB_TLS_SHARED_SECRET: ${WEB_TLS_SHARED_SECRET}
    depends_on:
      orchestrator:
        condition: service_started
    ports:
      - "3000:443"
    networks: [mgmt-net]
