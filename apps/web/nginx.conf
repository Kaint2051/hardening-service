# Mục "thống nhất 1 port" — trước đây browser phải tự tin cậy 3 origin khác
# nhau (:3000 SPA, :8000 Orchestrator API, :8444 Keycloak), mỗi origin 1 cert
# tự ký riêng -> phải bấm qua cảnh báo "không an toàn" 3 LẦN, thiếu 1 lần là
# fetch()/redirect sang origin đó bị trình duyệt chặn âm thầm, nhìn như UI bị
# lỗi (đúng hiện tượng "favicon.ico -> 400" trong log khi ai gõ http:// thay
# vì https://). Container này giờ là entrypoint DUY NHẤT — vừa serve SPA, vừa
# reverse-proxy /api và /realms|/resources|/admin sang orchestrator/keycloak
# qua chính docker network nội bộ (mgmt-net) — port 8000/8444 KHÔNG còn
# publish ra host (xem docker-compose.yml).
resolver 127.0.0.11 valid=10s;

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mặc định của image (nginx.conf gốc: keepalive_timeout 65) quá ngắn cho
    # wizard hardening — dry-run có thể chạy hàng trăm task Ansible (nhiều
    # phút), sau đó người dùng cần thời gian đọc diff trước khi bấm "Gửi
    # duyệt". Nếu khoảng nghỉ giữa 2 request vượt quá giá trị này, nginx tự
    # đóng connection keep-alive đang idle; trình duyệt vẫn thử dùng lại đúng
    # connection đó cho request kế tiếp, bị reset giữa chừng -> fetch() báo
    # "TypeError: Failed to fetch" ở client dù request vẫn kịp tới server và
    # xử lý xong (browser tự retry an toàn cho GET nên không thấy lỗi, nhưng
    # KHÔNG bao giờ tự retry POST/PUT/DELETE vì sợ trùng side-effect - verify
    # thật: orchestrator log ghi nhận POST .../submit-for-approval trả 201
    # Created đúng lúc UI báo lỗi "Failed to fetch").
    keepalive_timeout 300s;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;

    # Verify cert thật của orchestrator/keycloak khi proxy ngược (KHÔNG tắt
    # verify cho tiện) — ca-root.crt do fetch-cert.sh lưu lại từ chính
    # response mint cert của Orchestrator (AgentVerifyEnrollResponse.ca_root_pem),
    # cùng root CA đã ký cho orchestrator/keycloak nên verify được cả 2.
    proxy_ssl_trusted_certificate /etc/nginx/certs/ca-root.crt;
    proxy_ssl_verify on;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;

    # Header bảo mật cơ bản. connect-src giờ có thể SIẾT về 'self' (bỏ hẳn
    # wildcard "*" trước đây) — API + Keycloak giờ CÙNG origin với SPA nhờ
    # reverse-proxy dưới đây, không còn lý do phải mở connect-src rộng.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    # Orchestrator API — "/api/" bị strip trước khi forward (route thật phía
    # Orchestrator không có prefix /api, xem apps/orchestrator/app/jobs.py).
    # dùng $variable (thay vì proxy_pass tĩnh) để nginx tự re-resolve DNS
    # Docker (resolver ở trên) MỖI request — nếu không, nginx cache IP của
    # "orchestrator" lúc load config và sẽ "kẹt" IP cũ, 502 tới khi tự tay
    # reload, nếu container orchestrator được rebuild/restart độc lập với web
    # (đúng lớp lỗi "cache địa chỉ cũ" đã từng gặp ở nơi khác trong dự án
    # này). "set" PHẢI đứng TRƯỚC "rewrite ... break" — "break" dừng toàn bộ
    # xử lý của rewrite-module cho location này, kể cả "set" đứng SAU nó
    # (verify thật: đặt sau khiến nginx báo "using uninitialized variable" +
    # 500, không phải suy đoán).
    location /api/ {
        set $orchestrator_upstream https://orchestrator:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $orchestrator_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        # Mặc định nginx (60s) quá ngắn: remediate dry-run/apply là request
        # ĐỒNG BỘ, Orchestrator chờ job chạy xong mới trả response — đường
        # SSH agentless chờ tới 340s (job container timeout 300s + margin,
        # app/jobs.py `_call_job_dispatcher(..., timeout=340)`), đường Agent
        # Active Response chờ tới AGENT_REMEDIATE_DISPATCH_TIMEOUT=600s
        # (app/jobs.py). Thiếu dòng này, nginx tự trả 504 cho browser ở đúng
        # bước "Xem trước"/"Gửi duyệt" dù job backend vẫn chạy bình thường.
        proxy_read_timeout 650s;
        proxy_send_timeout 650s;
    }

    # Keycloak — auth/token/theme assets cho trang login (mọi path Keycloak
    # phục vụ ở root context, KHÔNG có prefix /auth ở bản 24). Host header
    # GIỮ NGUYÊN — dùng $http_host (KHÔNG phải $host, $host tự bỏ số port đi,
    # verify thật: dùng $host làm issuer thiếu hẳn ":3000") để khớp đúng
    # origin trình duyệt gõ (vd "172.30.2.111:3000") — Keycloak dev-mode tự
    # suy ra claim "iss" của token từ Host header nhận được, PHẢI khớp
    # KEYCLOAK_ISSUER_URL bên Orchestrator (app/config.py), nếu không
    # Orchestrator sẽ từ chối token vì "iss" sai.
    location ~ ^/(realms|resources|admin|robots\.txt) {
        set $keycloak_upstream https://keycloak:8443;
        proxy_pass $keycloak_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # SPA: mọi route client-side (React Router) đều fallback về index.html,
    # nếu không reload trang ở /hosts hay /controls sẽ ra 404 từ nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
