server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Header bảo mật cơ bản — trước đây thiếu hoàn toàn (phát hiện qua
    # review): không có CSP/X-Frame-Options nghĩa là SPA có thể bị nhúng
    # iframe (clickjacking) và không có lớp phòng thủ thứ 2 nếu lỡ có XSS.
    # connect-src cần cho phép gọi Orchestrator API + Keycloak (2 origin khác
    # với origin phục vụ chính SPA này) nên không thể default-src 'self' tuyệt
    # đối cho connect-src.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src *; frame-ancestors 'none'" always;

    # SPA: mọi route client-side (React Router) đều fallback về index.html,
    # nếu không reload trang ở /hosts hay /controls sẽ ra 404 từ nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
