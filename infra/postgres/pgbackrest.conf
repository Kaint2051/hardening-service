# Cấu hình pgBackRest — backup/PITR cho Postgres (Giai đoạn 3, Phase 1/7 HA
# control-plane, xem docs/architecture-proposal.md mục 7). Repo lưu tại
# /var/lib/pgbackrest (volume Docker riêng `pgbackrest-repo`, xem
# docker-compose.yml) — TẠM cùng VM với chính Postgres cho tới khi có VM thứ
# 2 (Phase 3-4), lúc đó chỉ cần đổi repo1-path/repo1-host, không đổi gì ở
# đây hay ở Postgres.
[global]
repo1-path=/var/lib/pgbackrest
# Giữ 7 full backup gần nhất (~1 tuần nếu backup.sh chạy full hàng ngày qua
# cron) — diff/incr (nếu dùng sau này) tự hết hạn theo full cha của nó, xem
# infra/postgres/README.md mục lịch backup.
repo1-retention-full=7
log-path=/var/log/pgbackrest
start-fast=y

[hardening-console]
# Khớp PGDATA mặc định của image postgres:16-alpine (mount volume
# postgres-data:/var/lib/postgresql/data trong docker-compose.yml).
pg1-path=/var/lib/postgresql/data
pg1-port=5432
